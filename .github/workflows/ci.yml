name: CI

# Lint, test and package voicebot. Runs on push to main and on every PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # test: install → ruff lint/format-check → pytest → build the wheel/sdist.
  #
  # The matrix spans Linux/macOS/Windows so platform-specific regressions in the
  # host-side package are caught early. The suite is network-free and needs no
  # microphone (the audio engine is faked), so it runs unchanged in CI — only
  # the Linux job uploads the build artifact, since the wheel is platform-neutral.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check src tests

      - name: Ruff format check
        run: poetry run ruff format --check src tests

      - name: Pytest
        run: poetry run pytest -q

      - name: Build wheel + sdist
        if: matrix.os == 'ubuntu-latest'
        run: poetry build

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: voicebot-dist
          path: dist/*
