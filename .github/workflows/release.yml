name: Release

# Triggered when a GitHub release is published via the UI (which `just
# bump-version` + `git push` sets up). Runs the tests, builds the package, and
# publishes it to PyPI via OIDC trusted publishing.
on:
  release:
    types: [published]

jobs:
  # ---------------------------------------------------------------------------
  # test: lint + test + build the Python package. The publish job depends on it.
  # ---------------------------------------------------------------------------
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check src tests

      - name: Pytest
        run: poetry run pytest -q

      - name: Build wheel + sdist
        run: poetry build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: voicebot-dist
          path: dist/

  # ---------------------------------------------------------------------------
  # publish-pypi: OIDC trusted publish — only runs after tests pass.
  # Configure the "pypi" environment + a trusted publisher for the
  # `touchy-voicebot` project on PyPI (workflow: release.yml).
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/touchy-voicebot
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: voicebot-dist
          path: dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
