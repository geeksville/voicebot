# voicebot — Poetry project.
#
# The distribution (PyPI) name is `touchy-voicebot`; the import package and the
# console script are both `voicebot`. The `touchy-pad` host library comes from
# PyPI, not a local path checkout — `just use-touchy-local` swaps in the sibling
# ../../app tree while hacking on the host library itself. See
# docs/plans/standalone.md.

[tool.poetry]
name = "touchy-voicebot"
version = "0.1.0"
description = "An eavesdropping desk robot: witty one-liners about overheard conversation, via a remote LLM."
authors = ["Touchy-Pad contributors"]
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["voice", "llm", "ollama", "speech-to-text", "moonshine", "touchy-pad", "led-matrix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "voicebot", from = "src" }]

[tool.poetry.dependencies]
# Match the touchy-pad host stack's supported range.
python = ">=3.11,<3.15"
# OpenAI-compatible client — used against the remote Ollama /v1 endpoint.
openai = ">=1.40"
# CLI framework (matches the touchy CLI / googly-vr conventions).
click = ">=8.1"
# Only for the native Ollama /api/chat fallback (exact sampler control).
requests = ">=2.31"
# Speech-to-text for `voicebot listen` — Moonshine Voice streaming models,
# CPU-friendly for the Raspberry Pi target. It bundles its own native library
# (no onnxruntime dependency) and ships prebuilt x86_64 + arm64 wheels.
moonshine-voice = "^0.1.5"
# Microphone capture (PortAudio bindings); moonshine-voice pulls it in too, but
# pinning it here makes the audio layer explicit.
sounddevice = "^0.5.6"
# Terminal logging that mirrors the pad: `HEARD` / `SKIP` / `REPLY` in colour,
# with the quip printed in its display colours (src/voicebot/logs.py). It
# already arrives transitively via touchy-pad; naming it makes the direct
# import honest. `>=13.7` is the first line that carries everything logs.py
# uses (RichHandler + truecolor `#rrggbb` Text styles).
rich = ">=13.7"
# The touchy-pad host library + screen DSL, driven by `voicebot listen --display
# pad` (src/voicebot/display.py). Pulled from PyPI; the floor is the first
# release that carries the host API voicebot uses (`SetPropertiesCmd` /
# `build_property_override` + `Label.recolor` from 0.3.5, and
# `Label.scroll_speed_px_s` from 0.3.8, which sets the marquee speed) — anything
# older breaks `--display pad`. `just use-touchy-local` swaps in a path dep
# against the sibling ../../app checkout for host-library development.
touchy-pad = ">=0.3.8"

[tool.poetry.urls]
Homepage = "https://github.com/geeksville/voicebot"
Repository = "https://github.com/geeksville/voicebot"
Issues = "https://github.com/geeksville/voicebot/issues"
Changelog = "https://github.com/geeksville/voicebot/releases"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
ruff = ">=0.8"

[tool.poetry.scripts]
voicebot = "voicebot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real remote LLM server (skipped unless VOICEBOT_LIVE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
